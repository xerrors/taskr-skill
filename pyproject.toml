[project]
name = "taskr"
version = "0.1.0"
description = "A Claude Code Skill and repo-local task protocol for AI-assisted software development."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PyYAML>=6.0",
]

[project.scripts]
taskr = "taskr.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/taskr"]

